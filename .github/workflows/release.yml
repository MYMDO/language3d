# Release pipeline: runs ONLY on version tags (vMAJOR.MINOR.PATCH).
# Builds all platforms, packages versioned archives and publishes the
# GitHub Release with downloadable files. Regular commits never release.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  PICO_SDK_TAG: "2.3.0"

jobs:
  build-linux:
    name: Linux package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config libsdl2-dev python3
      - name: Check tag matches VERSION file
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test "v$VERSION" = "${GITHUB_REF_NAME}" || \
            { echo "error: tag ${GITHUB_REF_NAME} != VERSION file (v$VERSION)" >&2; exit 1; }
      - name: Build + test
        run: |
          cmake --preset linux-release
          cmake --build --preset linux-release
          ctest --preset linux-release
      - name: Package
        run: ./tools/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*.tar.gz
          if-no-files-found: error

  build-windows:
    name: Windows package (native MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 via vcpkg
        run: vcpkg install sdl2:x64-windows
      - name: Build + test
        run: >
          cmake -S . -B build-windows -DLANGUAGE3D_PLATFORM=host
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake";
          cmake --build build-windows --config Release;
          ctest --test-dir build-windows -C Release --output-on-failure
      - name: Package
        run: powershell -ExecutionPolicy Bypass -File tools\package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*.zip
          if-no-files-found: error

  build-rp2040:
    name: RP2040 firmware package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Cache Pico SDK
        id: pico-sdk-cache
        uses: actions/cache@v4
        with:
          path: pico-sdk
          key: pico-sdk-${{ env.PICO_SDK_TAG }}
      - name: Fetch Pico SDK
        if: steps.pico-sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --branch "${PICO_SDK_TAG}" --depth 1 \
            https://github.com/raspberrypi/pico-sdk.git pico-sdk
          git -C pico-sdk submodule update --init --depth 1
      - name: Build firmware (clean directory)
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          rm -rf build-rp2040
          cmake -S . -B build-rp2040 \
            -DLANGUAGE3D_PLATFORM=rp2040 \
            -DPICO_SDK_PATH="${PICO_SDK_PATH}" \
            -DPICO_BOARD=pico
          cmake --build build-rp2040
          ls -la build-rp2040/language3d_rp2040.uf2 \
                 build-rp2040/language3d_rp2040.bin \
                 build-rp2040/language3d_rp2040.hex \
                 build-rp2040/language3d_rp2040.elf \
                 build-rp2040/language3d_rp2040.elf.map
      - name: Package
        run: ./tools/package-rp2040.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-rp2040
          path: |
            dist/*.uf2
            dist/*.bin
            dist/*.hex
            dist/*-debug.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-rp2040]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: List assets
        run: ls -la release-assets/
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          gh release create "${GITHUB_REF_NAME}" \
            --title "Language3D v${VERSION}" \
            --notes "Language3D v${VERSION}. Ready-to-run builds below: Linux game (.tar.gz), Windows game (.zip), RP2040 firmware (.uf2/.bin/.hex) and firmware debug bundle (-debug.zip). Flashing and controls: docs/platforms/. Full history: docs/CHANGELOG.md." \
            release-assets/*
